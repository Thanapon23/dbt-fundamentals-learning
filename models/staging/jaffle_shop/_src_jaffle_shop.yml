version: 2

sources:
  - name: jaffle_shop
    database: dbt-tutorial
    schema: jaffle_shop
    description: A clone of a Postgres application database.
    tables:
      - name: orders
        description: Raw orders data
        columns:
          - name: id
            description: Primary key for customers data
            data_tests:
              - unique
              - not_null
      - name: customers
        description: Raw customers data
        columns:
          - name: id
            description: Primary key for customers data
            data_tests:
              - unique
              - not_null
      - name: products
